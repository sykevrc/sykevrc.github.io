<header class="site-header">
  <nav class="navigation max-width-1 m-auto">
    <div class="nav-left">
      <a class="site-brand" href="{{ '/' | relative_url }}">
        {% if site.logo %}<img src="{{ site.logo | relative_url }}" alt="{{ site.title }}" width="64" height="64">{% else %}<span>{{ site.title }}</span>{% endif %}
      </a>
      <ul>
        <li><a href="{{ '/' | relative_url }}">Home</a></li>
        <li><a href="{{ '/#projects' | relative_url }}">Projects</a></li>
        <li><a href="{{ '/contact.html' | relative_url }}">Contact</a></li>
      </ul>
    </div>
    <form class="nav-search" action="{{ '/search.html' | relative_url }}" method="get">
      <input class="form-input" type="search" name="query" placeholder="Search">
      <button class="btn" type="submit">Search</button>
    </form>
  </nav>
</header>
